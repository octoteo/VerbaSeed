name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/course_schema
          - packages/content_source
          - packages/document_processing
          - packages/learning_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-content-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/content_store
        run: flutter pub get
      - name: Analyze
        working-directory: packages/content_store
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/content_store
        run: flutter test

  flutter-pdf-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter test

  flutter-local-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve local store dependencies
        working-directory: packages/local_store
        run: flutter pub get
      - name: Generate Drift code
        working-directory: packages/local_store
        run: dart run build_runner build
      - name: Analyze local store
        working-directory: packages/local_store
        run: flutter analyze --fatal-infos
      - name: Test local store
        working-directory: packages/local_store
        run: flutter test

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Drift web runtime
        run: bash scripts/prepare_local_store.sh

      - name: Resolve dependencies
        working-directory: apps/learner
        run: flutter pub get

      - name: Analyze
        working-directory: apps/learner
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: apps/learner
        run: flutter test

      - name: Build web
        working-directory: apps/learner
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbaseed-web
          path: apps/learner/build/web
          if-no-files-found: error
          retention-days: 14
