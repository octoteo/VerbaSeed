name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/course_schema
          - packages/content_source
          - packages/document_processing
          - packages/learning_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-content-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/content_store
        run: flutter pub get
      - name: Analyze
        working-directory: packages/content_store
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/content_store
        run: flutter test

  flutter-ocr-mlkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/ocr_google_mlkit
        run: flutter pub get
      - name: Analyze
        working-directory: packages/ocr_google_mlkit
        run: flutter analyze --fatal-infos
      - name: Test provider boundary
        working-directory: packages/ocr_google_mlkit
        run: flutter test

  flutter-pdf-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter pub get
      - name: Prepare PDFium test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" \
            | tar -xz -C "$RUNNER_TEMP/pdfium"
          test -f "$RUNNER_TEMP/pdfium/lib/libpdfium.so"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Analyze
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter test

  flutter-local-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve local store dependencies
        working-directory: packages/local_store
        run: flutter pub get
      - name: Generate Drift code
        working-directory: packages/local_store
        run: dart run build_runner build
      - name: Analyze local store
        working-directory: packages/local_store
        run: flutter analyze --fatal-infos
      - name: Test local store
        working-directory: packages/local_store
        run: flutter test

  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Drift code
        working-directory: packages/local_store
        run: |
          flutter pub get
          dart run build_runner build
      - name: Resolve app dependencies
        working-directory: apps/learner
        run: flutter pub get
      - name: Build release APK
        working-directory: apps/learner
        run: flutter build apk --release
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbaseed-android-apk
          path: apps/learner/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Prepare Drift web runtime
        run: bash scripts/prepare_local_store.sh
      - name: Resolve dependencies
        working-directory: apps/learner
        run: flutter pub get
      - name: Analyze
        working-directory: apps/learner
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: apps/learner
        run: flutter test
      - name: Build web
        working-directory: apps/learner
        run: flutter build web --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbaseed-web
          path: apps/learner/build/web
          if-no-files-found: error
          retention-days: 14
