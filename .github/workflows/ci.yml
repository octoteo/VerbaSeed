name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/course_schema
          - packages/content_source
          - packages/document_processing
          - packages/learning_engine
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        working-directory: ${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-content-store:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/content_store
        run: flutter pub get
      - name: Analyze
        working-directory: packages/content_store
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/content_store
        run: flutter test

  flutter-ocr-mlkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/ocr_google_mlkit
        run: flutter pub get
      - name: Analyze
        working-directory: packages/ocr_google_mlkit
        run: flutter analyze --fatal-infos
      - name: Test provider boundary
        working-directory: packages/ocr_google_mlkit
        run: flutter test

  flutter-pdf-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter pub get
      - name: Prepare PDFium test runtime
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" \
            | tar -xz -C "$RUNNER_TEMP/pdfium"
          test -f "$RUNNER_TEMP/pdfium/lib/libpdfium.so"
          echo "PDFIUM_PATH=$RUNNER_TEMP/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Analyze
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: packages/pdf_extractor_pdfrx
        run: flutter test

  flutter-local-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve local store dependencies
        working-directory: packages/local_store
        run: flutter pub get
      - name: Generate Drift code
        working-directory: packages/local_store
        run: dart run build_runner build
      - name: Analyze local store
        working-directory: packages/local_store
        run: flutter analyze --fatal-infos
      - name: Test local store
        working-directory: packages/local_store
        run: flutter test

  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test Android release packaging tooling
        working-directory: scripts
        run: python3 -m unittest -v test_package_android_release.py
      - name: Generate ephemeral CI release signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/verbaseed-ci-release.jks"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass verbaseed-ci-password \
            -alias verbaseed-ci \
            -keypass verbaseed-ci-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=VerbaSeed CI,O=VerbaSeed,C=US"
          cert=$(keytool -exportcert \
            -alias verbaseed-ci \
            -keystore "$keystore" \
            -storepass verbaseed-ci-password \
            -rfc \
            | openssl x509 -outform der \
            | sha256sum \
            | awk '{print $1}')
          echo "VERBASEED_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "VERBASEED_ANDROID_KEYSTORE_PASSWORD=verbaseed-ci-password" >> "$GITHUB_ENV"
          echo "VERBASEED_ANDROID_KEY_ALIAS=verbaseed-ci" >> "$GITHUB_ENV"
          echo "VERBASEED_ANDROID_KEY_PASSWORD=verbaseed-ci-password" >> "$GITHUB_ENV"
          echo "VERBASEED_REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          echo "CI_ANDROID_CERT_SHA256=$cert" >> "$GITHUB_ENV"
      - name: Generate Drift code
        working-directory: packages/local_store
        run: |
          flutter pub get
          dart run build_runner build
      - name: Resolve app dependencies
        working-directory: apps/learner
        run: flutter pub get
      - name: Build release APK and AAB through production signing path
        working-directory: apps/learner
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify CI-signed Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/learner/build/app/outputs/flutter-apk/app-release.apk"
          aab="apps/learner/build/app/outputs/bundle/release/app-release.aab"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print \
            | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          signer=$(
            "$apksigner" verify --print-certs "$apk" \
              | awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' \
              | tr -d '[:space:]:' \
              | tr '[:upper:]' '[:lower:]'
          )
          test "$signer" = "$CI_ANDROID_CERT_SHA256"
          jarsigner -verify "$aab" >/dev/null

          version_line=$(grep -E '^version:[[:space:]]+' apps/learner/pubspec.yaml | head -n 1)
          [[ "$version_line" =~ ^version:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]
          version_name="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          python3 scripts/package_android_release.py \
            --apk "$apk" \
            --aab "$aab" \
            --output-dir build/android-ci-release \
            --version-name "$version_name" \
            --version-code "$version_code" \
            --tag "v$version_name" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-sha256 "$signer"
          (cd build/android-ci-release && sha256sum --check SHA256SUMS)
      - name: Upload Android CI release-path evidence
        uses: actions/upload-artifact@v4
        with:
          name: verbaseed-android-ci-build
          path: build/android-ci-release
          if-no-files-found: error
          retention-days: 14

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Prepare Drift web runtime
        run: bash scripts/prepare_local_store.sh
      - name: Resolve dependencies
        working-directory: apps/learner
        run: flutter pub get
      - name: Analyze
        working-directory: apps/learner
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: apps/learner
        run: flutter test
      - name: Build web
        working-directory: apps/learner
        run: flutter build web --release
      - name: Prepare immutable Vercel Build Output
        run: bash scripts/prepare_vercel_output.sh
      - name: Upload tested Vercel output
        uses: actions/upload-artifact@v4
        with:
          name: verbaseed-vercel-output
          path: .vercel/output
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    needs:
      - dart-packages
      - flutter-content-store
      - flutter-ocr-mlkit
      - flutter-pdf-extractor
      - flutter-local-store
      - flutter-android
      - flutter-web
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "All required CI jobs passed for $GITHUB_SHA"

  vercel-deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'vercel-preview'))
    needs:
      - quality-gate
      - flutter-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_bz21L8a9F0PgjBt9LPBxZWK2
      VERCEL_PROJECT_ID: prj_9vst9iaa7S8XZjEUvNEMpNuFgpyd
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Detect external deployment configuration
        id: deploy-gate
        shell: bash
        run: |
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not configured; tested build artifact remains available from Actions."
          fi
      - name: Download exact tested web artifact
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v5
        with:
          name: verbaseed-vercel-output
          path: .vercel/output
      - name: Install pinned Vercel CLI
        if: steps.deploy-gate.outputs.enabled == 'true'
        run: npm install --global vercel@59.16.0
      - name: Deploy exact tested artifact
        if: steps.deploy-gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set +e
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            output=$(vercel deploy --prebuilt --archive=tgz --yes --prod --token "$VERCEL_TOKEN" 2>&1)
          else
            output=$(vercel deploy --prebuilt --archive=tgz --yes --token "$VERCEL_TOKEN" 2>&1)
          fi
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ $status -ne 0 ]]; then
            if grep -q 'api-deployments-free-per-day' <<<"$output"; then
              echo "::warning::Vercel free-plan daily deployment quota is exhausted. The tested artifact is retained in GitHub Actions; deployment can be retried after the quota resets."
              exit 0
            fi
            exit "$status"
          fi
