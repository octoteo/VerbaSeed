name: verbaseed_learner
description: VerbaSeed learner application.
publish_to: none
version: 0.2.13+15

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  file_picker: ^13.1.0
  mime: ^2.1.0
  course_schema:
    path: ../../packages/course_schema
  content_source:
    path: ../../packages/content_source
  content_store:
    path: ../../packages/content_store
  document_processing:
    path: ../../packages/document_processing
  ocr_google_mlkit:
    path: ../../packages/ocr_google_mlkit
  pdf_extractor_pdfrx:
    path: ../../packages/pdf_extractor_pdfrx
  learning_engine:
    path: ../../packages/learning_engine
  local_store:
    path: ../../packages/local_store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift: 2.35.0

flutter:
  uses-material-design: true
